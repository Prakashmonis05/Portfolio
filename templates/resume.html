{% extends "base.html" %}

{% block title %}Resume - Prakash Portfolio{% endblock %}

{% block content %}
<style>
.resume-section {
    padding: 4rem 2rem;
}

.resume-container {
    max-width: 900px;
    margin: auto;
}

/* HEADER */
.resume-header {
    text-align: center;
    margin-bottom: 3rem;
}

.resume-header h2 {
    font-size: 2.4rem;
    font-weight: 800;
}

.resume-header p {
    color: var(--text-gray);
    font-size: 1rem;
}

/* RESUME CARD */
.resume-preview {
    background: #fff;
    padding: 1.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.resume-preview img {
    width: 100%;
    border-radius: 8px;
}

/* DOWNLOAD BUTTON */
.resume-download {
    margin-top: 1.8rem;
    display: block;
    width: 100%;
    text-align: center;
    padding: 1rem;
    background: var(--red);
    color: #fff;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
}

.resume-download:hover {
    background: #cc0000;
}
</style>

<section class="resume-section">
    <div class="resume-container">

        <div class="resume-header">
            <h2>My Resume</h2>
            <p>Professional overview and qualifications</p>
        </div>

        <div class="resume-preview">
            <img src="{{ url_for('static', filename='resume/prakash_resume.jpg') }}"
                 alt="Resume Preview">

            <a href="{{ url_for('static', filename='resume/prakash_resume.pdf') }}"
               class="resume-download"
               download>
               Download Resume (PDF)
            </a>
        </div>

    </div>
</section>
{% endblock %}
