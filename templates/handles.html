{% extends "base.html" %}

{% block title %}Social Handles - Prakash Portfolio{% endblock %}

{% block content %}
<style>
/* ================= HANDLES SECTION ================= */
.handles-section {
    padding: 4rem 2rem;
}

.handles-container {
    max-width: 1100px;
    margin: auto;
}

/* ================= TITLE ================= */
.section-title {
    text-align: center;
    margin-bottom: 3rem;
}

.section-title h2 {
    font-size: 2.4rem;
    font-weight: 800;
}

.section-title p {
    font-size: 1rem;
    color: var(--text-gray);
}

/* ================= GRID ================= */
.handles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 2rem;
}

/* ================= CARD ================= */
.handle-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 2.2rem 1.5rem;
    text-align: center;
    text-decoration: none;
    color: #000;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
    border: 1px solid #f0f0f0;
}

.handle-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 40px rgba(255,0,0,0.18);
    border-color: var(--red);
}

/* ================= ICON ================= */
.handle-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
}

/* ================= TEXT ================= */
.handle-card h3 {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 0.4rem;
}

.handle-card p {
    font-size: 0.95rem;
    color: var(--text-gray);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
    .section-title h2 {
        font-size: 2rem;
    }

    .handle-icon {
        font-size: 2.6rem;
    }
}
</style>

<section class="handles-section">
    <div class="handles-container">
        <div class="section-title">
            <h2>Connect With Me</h2>
            <p>Let’s stay connected on social platforms</p>
        </div>

        <div class="handles-grid">
            {% for handle in handles %}
            <a href="{{ handle.url }}"
               class="handle-card"
               target="_blank"
               rel="noopener noreferrer">

                <div class="handle-icon">{{ handle.icon }}</div>
                <h3>{{ handle.name }}</h3>
                <p>Follow me on {{ handle.name }}</p>

            </a>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
